version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: functional-mysql-db
    restart: unless-stopped
    environment:
      # Bootstrap/admin account — used ONLY to run migrations. Never
      # point the application at this account.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a strong MYSQL_ROOT_PASSWORD in .env — no default is provided}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-functional_db}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
      - --local-infile=0
    ports:
      # Bound to localhost only by default — do not publish 0.0.0.0 in
      # any environment reachable from outside your machine/VPC.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

volumes:
  mysqldata:
